version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'chore'
      include: scope
    ignore:
      - dependency-name: 'chalk'
        versions: ['>=5']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
